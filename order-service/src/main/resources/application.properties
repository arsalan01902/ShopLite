server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:shopdb}
spring.datasource.username=${DB_USER:shoplite_user}
spring.datasource.password=${DB_PASSWORD:change_this_password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

catalog.url=${CATALOG_URL:http://catalog:3000}
inventory.url=${INVENTORY_URL:http://inventory:8081}
