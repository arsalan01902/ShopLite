
name: ShopLite CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Catalog
        uses: docker/build-push-action@v6
        with:
          context: ./catalog-service
          push: true
          tags: 666729139738.dkr.ecr.eu-north-1.amazonaws.com/shoplite-catalog:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: 666729139738.dkr.ecr.eu-north-1.amazonaws.com/shoplite-frontend:latest

      - name: Build and push Inventory
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-service
          push: true
          tags: 666729139738.dkr.ecr.eu-north-1.amazonaws.com/shoplite-inventory:latest

      - name: Build and push Orders
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: 666729139738.dkr.ecr.eu-north-1.amazonaws.com/shoplite-orders:latest


  deploy:
    name: Deploy ShopLite to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy through AWS Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ShopLite from GitHub Actions" \
            --parameters '{"commands":["mkdir -p /home/ubuntu/ShopLite/scripts"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "SSM command completed successfully"

